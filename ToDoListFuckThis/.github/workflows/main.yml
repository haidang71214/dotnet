name: Deploy .NET API

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Deploy qua SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            mkdir -p /root/todolist/dotnet
            cd /root/todolist/dotnet

            # Clone hoặc pull repo
            if [ ! -d ".git" ]; then
              git clone https://github.com/haidang71214/dotnet.git .
            else
              git fetch origin
              git reset --hard origin/main
            fi

            # Đi đến đúng thư mục chứa project BE
            cd source/repos/ToDoListFuckThis/ToDoListFuckThis

            # Publish + Build Docker
            dotnet publish -c Release -o publish
            docker build -t todolistbe .

            docker stop todolistbe-container || true
            docker rm todolistbe-container || true

            docker run -d \
              --name todolistbe-container \
              -p 5000:8080 \
              --restart unless-stopped \
              todolistbe

            docker ps | grep todolistbe
